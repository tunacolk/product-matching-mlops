name: matcher-api

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HF_HUB_OFFLINE=1
      - MATCHER_BACKEND=milvus
      - MILVUS_URI=http://milvus-standalone:19530
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    networks:
      - default
      - milvus

networks:
  milvus:
    external: true
    name: milvus